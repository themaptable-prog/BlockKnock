#world{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:max(17px,env(safe-area-inset-top));left:max(19px,env(safe-area-inset-left));right:max(19px,env(safe-area-inset-right));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;pointer-events:none}
.tool{position:relative;justify-self:start;pointer-events:auto}
.tool.right{justify-self:end}
.tool-main{min-width:158px;height:66px;display:grid;grid-template-columns:40px 1fr 10px;align-items:center;gap:9px;text-align:left;background:var(--paper);border:1px solid #fff4db;border-radius:17px;padding:7px 11px 7px 8px;box-shadow:0 3px 0 #ad835744,0 7px 20px var(--shadow)}
.tool-main[aria-pressed=true]{background:#e8f0d9;border-color:#f5f9e8;box-shadow:0 3px 0 #66815e6b,0 7px 20px var(--shadow)}
.tool-icon{width:40px;height:40px;border-radius:11px;background:#f1e2bf;display:grid;place-items:center}
.tool-main[aria-pressed=true] .tool-icon{background:#d5e4c2}
.tool-icon canvas{width:36px;height:36px}
.tool-copy{display:grid;gap:3px;line-height:1.05}
.tool-copy strong{font-size:14px;letter-spacing:.005em}
.tool-copy small{font-size:10px;font-weight:700;color:#66583f;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#c8b597;justify-self:end}
[aria-pressed=true] .dot{background:#4f8061;box-shadow:0 0 0 3px #4f806120}
.wordmark{margin:6px 0 0;display:flex;align-items:center;gap:.18em;font-family:Georgia,serif;font-weight:900;font-size:clamp(23px,4vw,49px);line-height:1;letter-spacing:-.073em;white-space:nowrap;color:#4a3928;filter:drop-shadow(0 2px 0 #fff4cc99)}
.wordmark span{color:#985039}
.palette-art{position:relative;width:33px;height:34px}
.palette-art i{position:absolute;width:15px;height:23px;top:6px;border-radius:4px;border:1px solid #553a2c4d;box-shadow:inset 0 2px 0 #fff6}
.palette-art i:nth-child(1){left:2px;transform:rotate(-21deg)}
.palette-art i:nth-child(2){left:10px;transform:rotate(-2deg)}
.palette-art i:nth-child(3){left:18px;transform:rotate(20deg)}
.picker{position:absolute;top:calc(100% + 11px);left:0;width:228px;background:var(--paper);border:1px solid #fff9e9;border-radius:19px;padding:13px;box-shadow:0 4px 0 #a9815355,0 12px 34px #53351d33}
.right .picker{left:auto;right:0}
.picker h2{margin:0 0 10px 2px;font-size:13px}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.options button{border:1px solid #ead6b2;background:#f8edcf;border-radius:10px;min-height:43px}
.options button[aria-checked=true]{border-color:#779471;background:#e6eed6}
.shapes button{padding:3px;display:grid;align-items:center;justify-items:center;gap:1px;font-size:10px;font-weight:700}
.shapes canvas{width:36px;height:36px}
.palettes{display:grid;gap:5px}
.palettes button{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;font-size:12px;font-weight:700}
.swatches{display:flex;gap:3px}
.swatches i{width:13px;height:17px;border:1px solid #553a2c30;border-radius:3px}
#utility{position:absolute;right:max(19px,env(safe-area-inset-right));bottom:max(23px,calc(env(safe-area-inset-bottom) + 11px));display:flex;gap:7px;z-index:1}
.icon-button{height:44px;width:44px;display:grid;place-items:center;padding:0;border:1px solid #fff5dc;border-radius:12px;background:#fff3d9e8;box-shadow:0 2px 0 #9262394d;color:#533b29}
.icon-button svg{width:19px;height:19px}
#hint{position:absolute;pointer-events:none;left:50%;top:15%;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:#fff6deea;color:#5d432f;font-size:12px;font-weight:700;white-space:nowrap}
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:#51382122}
.card{width:min(330px,calc(100% - 36px));background:#fff6e1;border:1px solid #fff9ec;box-shadow:0 5px 0 #93673b52,0 16px 60px #6c43252e;border-radius:26px;text-align:center;padding:25px 24px 24px}
.card h2{font-family:Georgia,serif;font-size:30px;letter-spacing:-.04em;margin:3px 0 6px;line-height:1.08}
.card p{margin:0 0 17px;color:#684f38;font-size:13px;line-height:1.55}
.card p:last-child{margin-bottom:0}
.card .stamp{width:58px;height:53px;margin:-3px auto 6px;display:flex;align-items:center;justify-content:center;gap:2px;color:#537860}
.stamp canvas{width:28px;height:38px}
.stamp canvas:first-child{transform:rotate(-14deg) translateY(4px)}
.stamp canvas:last-child{transform:rotate(15deg) translateY(-1px)}
.primary{min-height:49px;min-width:154px;border:1px solid #426f59;padding:7px 21px;border-radius:14px;color:#fff9e7;background:var(--green);box-shadow:0 3px 0 var(--green-dark);font-weight:800}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-dark)}
#orientation{background:#f6e2b8;z-index:5}
#orientation svg{width:39px;height:39px;color:#567b62;margin:0 0 8px}
@media(max-height:450px){
  #top{top:max(9px,env(safe-area-inset-top))}
  .tool-main{height:54px;min-width:132px;grid-template-columns:34px 1fr 8px;gap:6px}
  .tool-icon{width:34px;height:34px}
  .tool-icon canvas{width:31px;height:31px}
  .wordmark{margin-top:4px}
  #hint{top:70px}
  .card{padding:14px 20px 16px}
  .card .stamp{height:37px;margin:0 auto}
  .card h2{font-size:25px}
  .card p{margin-bottom:11px}
  #utility{bottom:max(14px,calc(env(safe-area-inset-bottom) + 5px))}
}
</style>
</head>
<body>
<main id="stage" aria-label="Block Knock playroom">
  <canvas id="world" aria-label="Block play area"></canvas>
  <header id="top" inert>
    <div class="tool">
      <button id="shape-button" class="tool-main" aria-label="Shape tool. Hold to choose a block" aria-pressed="true" aria-expanded="false" aria-controls="shape-picker" aria-haspopup="dialog">
        <span class="tool-icon"><canvas id="shape-icon" width="72" height="72" aria-hidden="true"></canvas></span>
        <span class="tool-copy"><strong id="shape-name">Square</strong><small id="shape-mode">Build · hold to pick</small></span><span aria-hidden="true" class="dot"></span>
      </button>
      <div class="picker" id="shape-picker" role="dialog" aria-label="Choose a shape" hidden><h2>Choose a shape</h2><div id="shape-options" class="options shapes" role="radiogroup" aria-label="Shapes"></div></div>
    </div>
    <h1 class="wordmark">Block <span>Knock</span></h1>
    <div class="tool right">
      <button id="colour-button" class="tool-main" aria-label="Paint tool. Hold to choose a colour style" aria-pressed="false" aria-expanded="false" aria-controls="colour-picker" aria-haspopup="dialog">
        <span class="tool-icon"><span class="palette-art" id="colour-icon" aria-hidden="true"></span></span>
        <span class="tool-copy"><strong id="colour-name">Toybox</strong><small id="colour-mode">Paint off · hold to pick</small></span><span aria-hidden="true" class="dot"></span>
      </button>
      <div class="picker" id="colour-picker" role="dialog" aria-label="Choose a colour style" hidden><h2>Choose a colour style</h2><div id="colour-options" class="options palettes" role="radiogroup" aria-label="Colour styles"></div></div>
    </div>
  </header>

  </section>
</main>
<script>
"use strict";

const WIDTH = 1200;
const HEIGHT = 720;
const FLOOR = 686;
const STEP = 1 / 144;
const GRAVITY = 1420;
const MAX_SPEED = 2350;
const MAX_BLOCKS = 160;
const TAU = Math.PI * 2;

const shapes = [
  { name: "Square", points: [[-35,-35],[35,-35],[35,35],[-35,35]] },
  { name: "Plank", points: [[-62,-20],[62,-20],[62,20],[-62,20]] },
  { name: "Triangle", points: [[0,-49],[48,28],[-48,28]] },
  { name: "Round", radius: 36 },
  { name: "Keystone", points: [[-28,-28],[28,-28],[54,28],[-54,28]] },
  { name: "Hexagon", points: [[-22,-37],[22,-37],[44,0],[22,37],[-22,37],[-44,0]] }
];

const palettes = [
  { name: "Toybox", colours: ["#da7759","#e7b64f","#60a28d","#6c97b9","#9e80a9","#d5899c"] },
  { name: "Orchard", colours: ["#bd5747","#d8854d","#e1a448","#a0a95e","#60895c","#9a6a55"] },
  { name: "Seaside", colours: ["#468a92","#7db5ac","#7399bd","#4b6eaa","#e2c887","#e49176"] },
  { name: "Sugar Berry", colours: ["#d8879c","#b077a9","#826ab1","#e9aa8d","#e4ba75","#a38ac2"] },
  { name: "Forest", colours: ["#456f62","#678955","#a4a568","#a47e57","#ce995b","#b76c55"] },
  { name: "Rainbow", colours: ["#e35d55","#ed9348","#efc445","#71a762","#5299c2","#9668ae"] }
];

const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const wrapped = a => Math.atan2(Math.sin(a), Math.cos(a));
const rotate = (x, y, angle) => {
  const c = Math.cos(angle), s = Math.sin(angle);
  return { x: x * c - y * s, y: x * s + y * c };
};

let nextBodyId = 0;
let previousContacts = new Map();

function makeBody(shape, x, y, fixed = false) {
  let points, area, moment;
  const radius = shape.radius || 0;
  if (radius) {
    area = Math.PI * radius * radius;
    moment = radius * radius / 2;
  } else {
    let twiceArea = 0, sumX = 0, sumY = 0;
    for (let i = 0; i < shape.points.length; i++) {
      const [ax,ay] = shape.points[i], [bx,by] = shape.points[(i + 1) % shape.points.length];
      const cross = ax * by - ay * bx;
      twiceArea += cross;
      sumX += (ax + bx) * cross;
      sumY += (ay + by) * cross;
    }
    const centerX = sumX / (3 * twiceArea), centerY = sumY / (3 * twiceArea);
    points = shape.points.map(([px,py]) => ({ x: px - centerX, y: py - centerY }));
    let sumMoment = 0;
    for (let i = 0; i < points.length; i++) {
      const a = points[i], b = points[(i + 1) % points.length];
      const cross = a.x * b.y - a.y * b.x;
      sumMoment += cross * (a.x*a.x + a.y*a.y + a.x*b.x + a.y*b.y + b.x*b.x + b.y*b.y);
    }
    area = twiceArea / 2;
    moment = sumMoment / (6 * twiceArea);
  }
  const mass = area / 4400;
  const body = {
    id: nextBodyId++, x, y, angle: 0, vx: 0, vy: 0, spin: 0, points, radius,
    inverseMass: fixed ? 0 : 1 / mass, inverseMoment: fixed ? 0 : 1 / (mass * moment),
    vertices: points?.map(() => ({ x: 0, y: 0, nx: 0, ny: 0 })),
    minX: 0, maxX: 0, minY: 0, maxY: 0, grabs: [], gesture: null
  };
  updateGeometry(body);
  return body;
}

function updateGeometry(body) {
  const {x, y, radius} = body;
  if (radius) {
    body.minX = x - radius;
    body.maxX = x + radius;
    body.minY = y - radius;
    body.maxY = y + radius;
    return;
  }
  const c = Math.cos(body.angle), s = Math.sin(body.angle);
  body.minX = body.minY = Infinity;
  body.maxX = body.maxY = -Infinity;
  for (let i = 0; i < body.points.length; i++) {
    const p = body.points[i], v = body.vertices[i];
    v.x = x + c*p.x - s*p.y;
    v.y = y + s*p.x + c*p.y;
    body.minX = Math.min(body.minX, v.x);
    body.maxX = Math.max(body.maxX, v.x);
    body.minY = Math.min(body.minY, v.y);
    body.maxY = Math.max(body.maxY, v.y);
  }
  for (let i = 0; i < body.vertices.length; i++) {
    const a = body.vertices[i], b = body.vertices[(i+1) % body.vertices.length];
    const length = Math.hypot(b.x - a.x, b.y - a.y);
    a.nx = (b.y - a.y) / length;
    a.ny = (a.x - b.x) / length;
  }
}

const blocks = [];
const ground = makeBody({points:[[-850,-80],[850,-80],[850,80],[-850,80]]}, WIDTH / 2, FLOOR + 80, true);
const pointers = new Map();

function separatingFace(reference, incident) {
  let distance = -Infinity, index = 0;
  for (let i = 0; i < reference.vertices.length; i++) {
    const face = reference.vertices[i];
    let nearest = Infinity;
    for (const v of incident.vertices) {
      nearest = Math.min(nearest, (v.x - face.x) * face.nx + (v.y - face.y) * face.ny);
    }
    if (nearest > distance) {
      distance = nearest;
      index = i;
    }
  }
  return { distance, index };
}

function clipSegment(segment, nx, ny, limit) {
  if (segment.length < 2) return segment.filter(p => p.x * nx + p.y * ny <= limit);
  const [a,b] = segment;
  const d1 = a.x * nx + a.y * ny - limit;
  const d2 = b.x * nx + b.y * ny - limit;
  const clipped = [];
  if (d1 <= 0) clipped.push(a);
  if (d2 <= 0) clipped.push(b);
  if (d1 * d2 < 0) {
    const t = d1 / (d1 - d2);
    clipped.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
  return clipped;
}

function polygonContact(a, b) {
  const ab = separatingFace(a,b);
  if (ab.distance > 0) return null;
  const ba = separatingFace(b,a);
  if (ba.distance > 0) return null;
  const reverse = ba.distance > ab.distance + .12;
  const ref = reverse ? b : a, other = reverse ? a : b;
  const index = reverse ? ba.index : ab.index;
  const start = ref.vertices[index], end = ref.vertices[(index + 1) % ref.vertices.length];
  const {nx, ny} = start;
  let minDot = Infinity, incidentIndex = 0;
  for (let i = 0; i < other.vertices.length; i++) {
    const face = other.vertices[i], dot = face.nx * nx + face.ny * ny;
    if (dot < minDot) {
      minDot = dot;
      incidentIndex = i;
    }
  }
  const edge = [other.vertices[incidentIndex], other.vertices[(incidentIndex + 1) % other.vertices.length]];
  const tx = -ny, ty = nx;
  const clippedStart = clipSegment(edge, -tx, -ty, -tx*start.x - ty*start.y);
  const clipped = clipSegment(clippedStart, tx, ty, tx*end.x + ty*end.y);
  const contacts = [];
  for (const v of clipped) {
    const depth = (start.x - v.x) * nx + (start.y - v.y) * ny;
    if (depth >= 0) contacts.push({ x: v.x + nx*depth*.5, y: v.y + ny*depth*.5, depth });
  }
  if (!contacts.length) return null;
  return { nx: reverse ? -nx : nx, ny: reverse ? -ny : ny, contacts };
}

function circlePolygonContact(circle, polygon) {
  const r = circle.radius;
  let separation = -Infinity, nearFace, nearest, nearestDistance = Infinity;
  for (let i = 0; i < polygon.vertices.length; i++) {
    const a = polygon.vertices[i], b = polygon.vertices[(i+1) % polygon.vertices.length];
    const dx = circle.x - a.x, dy = circle.y - a.y;
    const offset = dx * a.nx + dy * a.ny;
    if (offset > r) return null;
    if (offset > separation) {
      separation = offset;
      nearFace = a;
    }
    const ex = b.x-a.x, ey = b.y-a.y;
    const t = clamp((dx*ex + dy*ey) / (ex*ex + ey*ey), 0, 1);
    const x = a.x + ex*t, y = a.y + ey*t;
    const sq = (x-circle.x)**2 + (y-circle.y)**2;
    if (sq < nearestDistance) {
      nearest = {x, y};
      nearestDistance = sq;
    }
  }
  if (separation <= 0) {
    const {nx, ny} = nearFace;
    return { nx: -nx, ny: -ny, contacts: [{x: circle.x - nx*separation, y: circle.y - ny*separation, depth: r - separation}] };
  }
  if (nearestDistance > r*r) return null;
  const distance = Math.sqrt(nearestDistance);
  return { nx: (nearest.x-circle.x)/distance, ny: (nearest.y-circle.y)/distance,
    contacts: [{x: nearest.x, y: nearest.y, depth: r - distance}] };
}

function manifold(a, b) {
  if (!a.radius && !b.radius) return polygonContact(a, b);
  if (a.radius && !b.radius) return circlePolygonContact(a,b);
  if (!a.radius && b.radius) {
    const hit = circlePolygonContact(b,a);
    return hit && { nx: -hit.nx, ny: -hit.ny, contacts: hit.contacts };
  }
  const dx = b.x-a.x, dy = b.y-a.y, distance = Math.hypot(dx,dy);
  const depth = a.radius + b.radius - distance;
  if (depth < 0) return null;
  const nx = distance ? dx/distance : 1, ny = distance ? dy/distance : 0;
  return { nx, ny, contacts: [{x:a.x + nx*(a.radius-depth/2), y:a.y + ny*(a.radius-depth/2), depth}] };
}

function applyImpulse(contact, x, y) {
  const {a,b,ax,ay,bx,by} = contact;
  a.vx -= x*a.inverseMass;
  a.vy -= y*a.inverseMass;
  a.spin -= (ax*y - ay*x)*a.inverseMoment;
  b.vx += x*b.inverseMass;
  b.vy += y*b.inverseMass;
  b.spin += (bx*y - by*x)*b.inverseMoment;
}

function projectedVelocity(contact, axisX, axisY) {
  const {a,b,ax,ay,bx,by} = contact;
  return (b.vx - by*b.spin - a.vx + ay*a.spin)*axisX
       + (b.vy + bx*b.spin - a.vy - ax*a.spin)*axisY;
}

function contactConstraints(a, b, contacts, nextContacts) {
  const hit = manifold(a,b);
  if (!hit) return;
  const {nx,ny} = hit;
  const key = a.id + ":" + b.id;
  const previous = previousContacts.get(key);
  const reusable = previous && previous.nx*nx + previous.ny*ny > .97 ? previous.points.slice() : [];
  const current = [];
  let strongest = 0;
  for (const p of hit.contacts) {
    const ax = p.x-a.x, ay = p.y-a.y, bx = p.x-b.x, by = p.y-b.y;
    const mass = a.inverseMass + b.inverseMass;
    const normalMass = mass + (ax*ny-ay*nx)**2 * a.inverseMoment + (bx*ny-by*nx)**2 * b.inverseMoment;
    const tangentMass = mass + (ax*nx+ay*ny)**2 * a.inverseMoment + (bx*nx+by*ny)**2 * b.inverseMoment;
    const contact = {a,b,ax,ay,bx,by,nx,ny,normalMass,tangentMass, normal:0,tangent:0, target:0, x:p.x, y:p.y};
    const speed = -projectedVelocity(contact,nx,ny);
    const bounce = speed > 100 ? speed * (a.pusher || b.pusher ? .12 : .22) : 0;
    contact.target = Math.max(bounce, clamp((p.depth - .25) * 26, 0, 170));
    if (speed < 75 && reusable.length) {
      let closest = -1, distance = 13**2;
      for (let i = 0; i < reusable.length; i++) {
        const old = reusable[i];
        const squared = (old.x-p.x)**2 + (old.y-p.y)**2;
        if (squared < distance) {
          distance = squared;
          closest = i;
        }
      }
      if (closest >= 0) {
        const [old] = reusable.splice(closest,1);
        contact.normal = old.normal * .91;
        contact.tangent = old.tangent * .91;
      }
    }
    contacts.push(contact);
    current.push(contact);
    strongest = Math.max(strongest, speed);
  }
  nextContacts.set(key,{nx,ny,points:current});
  if (strongest > 47) recordImpact(strongest, a, b);
}

function solveContact(contact) {
  const {nx,ny,normalMass,tangentMass} = contact;
  const nextNormal = Math.max(0, contact.normal + (contact.target - projectedVelocity(contact,nx,ny)) / normalMass);
  const impulse = nextNormal - contact.normal;
  contact.normal = nextNormal;
  applyImpulse(contact, impulse * nx, impulse * ny);
  const friction = .62 * contact.normal;
  const nextTangent = clamp(contact.tangent - projectedVelocity(contact,-ny,nx) / tangentMass, -friction, friction);
  const tangentImpulse = nextTangent - contact.tangent;
  contact.tangent = nextTangent;
  applyImpulse(contact, -ny * tangentImpulse, nx * tangentImpulse);
}

function steerGrab(body) {
  if (!body.grabs.length) return;
  let targetX = 0, targetY = 0;
  if (body.gesture) {
    const [one,two] = body.grabs;
    const offset = rotate(body.gesture.x, body.gesture.y, body.angle);
    targetX = (one.x + two.x) / 2 - offset.x;
    targetY = (one.y + two.y) / 2 - offset.y;
    body.spin = clamp(wrapped(body.gesture.angle - body.angle) * 48, -24, 24);
  } else {
    const grab = body.grabs[0];
    const offset = rotate(grab.localX, grab.localY, body.angle);
    targetX = grab.x - offset.x;
    targetY = grab.y - offset.y;
    body.spin *= .89;
  }
  targetY = Math.min(targetY,FLOOR - (body.maxY - body.y));
  body.vx = clamp((targetX - body.x) * 58, -MAX_SPEED, MAX_SPEED);
  body.vy = clamp((targetY - body.y) * 58, -MAX_SPEED, MAX_SPEED);
}

function simulate() {
  const bodies = [ground, ...blocks];
  for (const body of blocks) {
    body.vx = clamp(body.vx*.9993, -MAX_SPEED, MAX_SPEED);
    body.vy = clamp(body.vy + GRAVITY*STEP, -MAX_SPEED, MAX_SPEED);
    body.spin = clamp(body.spin*.996, -24, 24);
    steerGrab(body);
    body.x += body.vx*STEP;
    body.y += body.vy*STEP;
    body.angle = wrapped(body.angle + body.spin*STEP);
    updateGeometry(body);
  }
  for (const touch of pointers.values()) {
    const proxy = touch.proxy;
    if (!proxy) continue;
    proxy.vx = clamp((touch.x - proxy.x) / STEP, -MAX_SPEED, MAX_SPEED);
    proxy.vy = clamp((touch.y - proxy.y) / STEP, -MAX_SPEED, MAX_SPEED);
    proxy.x += proxy.vx * STEP;
    proxy.y += proxy.vy * STEP;
    updateGeometry(proxy);
    bodies.push(proxy);
  }
  bodies.sort((a,b) => a.minX - b.minX);
  const contacts = [];
  const nextContacts = new Map();
  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    for (let j = i+1; j < bodies.length; j++) {
      const b = bodies[j];
      if (b.minX > a.maxX) break;
      if ((!a.inverseMass && !b.inverseMass) || a.maxY < b.minY || b.maxY < a.minY) continue;
      if (a.id < b.id) contactConstraints(a,b,contacts,nextContacts);
      else contactConstraints(b,a,contacts,nextContacts);
    }
  }
  previousContacts = nextContacts;
  for (const {a,b,ax,ay,bx,by,nx,ny,normal,tangent} of contacts) {
    if (normal || tangent) applyImpulse({a,b,ax,ay,bx,by},normal*nx-tangent*ny,normal*ny+tangent*nx);
  }
  for (let i = 0; i < 16; i++) {
    for (const contact of contacts) solveContact(contact);
  }
  for (let i = blocks.length - 1; i >= 0; i--) {
    const block = blocks[i];
    if (block.maxX < 0 || block.minX > WIDTH || block.minY > HEIGHT + 120) {
      for (const touch of block.grabs) touch.body = null;
      blocks.splice(i, 1);
    }
  }
}


const audio = {
  context: null, master: null, muted: false, timer: null, nextNote: 0, beat: 0, noise: null,
  lastHit: -Infinity, lastKnock: -Infinity, knocks: 0, pending: null
};

const melody = [
  [0,69],[2,72],[4,76],[7,74],[9,72],[12,67],[14,69],
  [16,65],[19,69],[22,72],[24,69],[26,67],[29,64],
  [32,65],[34,69],[36,72],[39,76],[41,77],[44,76],[46,72],
  [48,74],[51,67],[54,71],[56,72],[59,64],[62,67]
];
const chords = [[48,55],[45,52],[41,48],[43,50],[41,48],[45,52],[43,50],[48,55]];
const noteByBeat = new Map(melody);
const hertz = midi => 440 * 2 ** ((midi - 69) / 12);

function openAudio() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  if (!audio.context) {
    audio.context = new AudioContext();
    audio.master = audio.context.createGain();
    audio.master.gain.value = audio.muted ? 0 : .79;
    audio.master.connect(audio.context.destination);
    audio.noise = audio.context.createBuffer(1, Math.floor(audio.context.sampleRate * .12), audio.context.sampleRate);
    const samples = audio.noise.getChannelData(0);
    for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
  }
  audio.context.resume().catch(() => {});
}

function tone(time, frequency, volume, length, type = "sine", bend = 1) {
  const osc = audio.context.createOscillator();
  const envelope = audio.context.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(frequency, time);
  if (bend !== 1) osc.frequency.exponentialRampToValueAtTime(frequency * bend, time + length * .6);
  envelope.gain.setValueAtTime(.0001, time);
  envelope.gain.linearRampToValueAtTime(volume, time + .008);
  envelope.gain.exponentialRampToValueAtTime(.0001, time + length);
  osc.connect(envelope).connect(audio.master);
  osc.start(time);
  osc.stop(time + length + .01);
}

function scheduleMelody() {
  const context = audio.context;
  if (!context || context.state !== "running" || audio.muted) return;
  if (audio.nextNote < context.currentTime) audio.nextNote = context.currentTime + .04;
  while (audio.nextNote < context.currentTime + .16) {
    const t = audio.nextNote;
    const beat = audio.beat;
    const lead = noteByBeat.get(beat);
    if (lead) {
      tone(t, hertz(lead), .039, .39, "triangle");
      tone(t + .01, hertz(lead + 12), .008, .18);
    }
    if (beat % 8 === 0) tone(t, hertz(chords[beat / 8][0]), .035, .63);
    if (beat % 8 === 4 || beat % 8 === 6) {
      tone(t, hertz(chords[Math.floor(beat / 8)][1]), .024, .36, "triangle");
    }
    audio.nextNote += beat % 2 === 0 ? .206 : .175;
    audio.beat = (beat + 1) % 64;
  }
}

function setAudioRunning(running) {
  clearInterval(audio.timer);
  audio.timer = null;
  if (!audio.context) return;
  if (running) {
    audio.context.resume().catch(() => {});
    audio.nextNote = 0;
    audio.timer = setInterval(scheduleMelody, 75);
  } else {
    audio.pending = null;
    audio.context.suspend().catch(() => {});
  }
}

function recordImpact(speed, a, b) {
  if (!audio.context || audio.muted) return;
  const now = performance.now();
  const pair = a.recentHits ??= new WeakMap();
  const previous = pair.get(b) ?? -Infinity;
  pair.set(b, now);
  (b.recentHits ??= new WeakMap()).set(a, now);
  if (now - previous < 55) return;
  if (!audio.pending || speed > audio.pending.speed) {
    const mass = a.inverseMass && b.inverseMass ? 2 / (a.inverseMass + b.inverseMass) : 1 / (a.inverseMass || b.inverseMass);
    audio.pending = {speed, mass};
  }
}

function flushImpact(now) {
  const hit = audio.pending;
  audio.pending = null;
  if (!hit) return;
  if (now - audio.lastHit >= 400) audio.knocks = 0;
  audio.lastHit = now;
  if (now - audio.lastKnock < (audio.knocks >= 5 ? 400 : 100)) return;
  audio.lastKnock = now;
  audio.knocks++;

  const context = audio.context;
  if (!context || context.state !== "running") return;
  const t = context.currentTime, level = clamp(hit.speed / 860, .17, 1);
  const pitch = (238 / Math.sqrt(hit.mass)) * (.92 + .17 * Math.random());
  tone(t, pitch, .21 * level, .105, "sine", .58);
  tone(t, pitch * 2.36, .075 * level, .05, "triangle", .87);
  const source = context.createBufferSource();
  const filter = context.createBiquadFilter();
  const gain = context.createGain();
  source.buffer = audio.noise;
  filter.type = "bandpass";
  filter.frequency.value = 710 + Math.random() * 480;
  filter.Q.value = .8;
  gain.gain.setValueAtTime(.22 * level, t);
  gain.gain.exponentialRampToValueAtTime(.0001, t + .07);
  source.connect(filter).connect(gain).connect(audio.master);
  source.start(t, Math.random() * .035, .07);
}


const $ = id => document.getElementById(id);
const canvas = $("world");
const stage = $("stage");
const ctx = canvas.getContext("2d", {alpha: true});
const swappable = shapes.map(shape => makeBody(shape, 0, 0));
const sprites = new Map();

function colourShift(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const rgb = [n >> 16, (n >> 8) & 255, n & 255];
  const end = amount < 0 ? 0 : 255;
  return "rgb(" + rgb.map(c => Math.round(c + (end - c) * Math.abs(amount))).join(",") + ")";
}

function randomSeed(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) | 0;
    return (seed >>> 0) / 4294967296;
  };
}

function blockPath(paint, body) {
  paint.beginPath();
  if (body.radius) {
    paint.arc(0,0,body.radius,0,TAU);
  } else {
    const points = body.points;
    paint.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) paint.lineTo(points[i].x, points[i].y);
    paint.closePath();
  }
}

function blockImage(shapeIndex, hex, seed) {
  const key = shapeIndex + hex + seed;
  if (sprites.has(key)) return sprites.get(key);
  const body = swappable[shapeIndex];
  const image = document.createElement("canvas");
  const size = 74;
  image.width = image.height = size * 4;
  const paint = image.getContext("2d");
  paint.setTransform(2,0,0,2,image.width/2,image.height/2);
  paint.lineJoin = "round";
  const random = randomSeed(19001 + seed * 7789 + shapeIndex * 151);
  blockPath(paint,body);
  const finish = paint.createLinearGradient(-42,-43,47,47);
  finish.addColorStop(0,colourShift(hex,.30));
  finish.addColorStop(.39,colourShift(hex,.09));
  finish.addColorStop(1,colourShift(hex,-.12));
  paint.fillStyle = finish;
  paint.fill();
  paint.save();
  paint.clip();
  for (let i = 0; i < 28; i++) {
    const y = -60 + i*4.6 + random()*4.4;
    const phase = random()*TAU, amp = .5 + random()*2.4;
    paint.beginPath();
    for (let x = -70; x <= 70; x += 3) {
      const gy = y + Math.sin(x*.033 + phase)*amp + Math.sin(x*.081 + phase)*.55;
      if (x === -70) paint.moveTo(x,gy);
      else paint.lineTo(x,gy);
    }
    paint.strokeStyle = i % 3 === 0 ? "rgba(255,250,213,.15)" : "rgba(87,50,29,.095)";
    paint.lineWidth = .35 + random()*.6;
    paint.stroke();
  }
  const knotX = (random()-.5)*43, knotY = (random()-.5)*35;
  paint.strokeStyle = "rgba(84,49,28,.12)";
  paint.lineWidth = .66;
  for (let i = 0; i < 3; i++) {
    paint.beginPath();
    paint.ellipse(knotX,knotY,5 + i*4,1.4 + i*1.25,.06,0,TAU);
    paint.stroke();
  }
  paint.lineWidth = 7;
  paint.strokeStyle = "rgba(76,39,24,.10)";
  blockPath(paint,body);
  paint.translate(0,-2);
  paint.stroke();
  paint.restore();
  blockPath(paint,body);
  paint.lineWidth = 3.05;
  paint.strokeStyle = colourShift(hex,-.34);
  paint.stroke();
  paint.translate(0,1.8);
  blockPath(paint,body);
  paint.lineWidth = .85;
  paint.strokeStyle = "rgba(255,245,216,.34)";
  paint.save();
  paint.translate(0,-1.8);
  blockPath(paint,body);
  paint.clip();
  paint.translate(0,1.8);
  blockPath(paint,body);
  paint.stroke();
  paint.restore();
  if (sprites.size >= 160) sprites.delete(sprites.keys().next().value);
  sprites.set(key,image);
  return image;
}

function drawIcon(target, shape, colour) {
  const paint = target.getContext("2d");
  const factor = Math.min(target.width,target.height) / 152;
  paint.clearRect(0,0,target.width,target.height);
  paint.save();
  paint.translate(target.width/2,target.height/2);
  paint.scale(factor,factor);
  paint.drawImage(blockImage(shape,colour,0),-74,-74,148,148);
  paint.restore();
}

let floorImage;
function createFloor() {
  const floor = document.createElement("canvas");
  floor.width = WIDTH;
  floor.height = HEIGHT - FLOOR;
  const p = floor.getContext("2d");
  const edge = p.createLinearGradient(0,0,0,floor.height);
  edge.addColorStop(0,"#eac38a");
  edge.addColorStop(.12,"#d7a468");
  edge.addColorStop(.92,"#b97946");
  edge.addColorStop(1,"#a5683e");
  p.fillStyle = edge;
  p.fillRect(0,0,WIDTH,floor.height);
  const random = randomSeed(142);
  for (let i = 0; i < 53; i++) {
    const x = random()*WIDTH, y = 6 + random()*27, length = 10 + random()*155;
    p.strokeStyle = i % 2 ? "#fce0a944" : "#8c4f312a";
    p.lineWidth = .5 + random()*.5;
    p.beginPath(); p.moveTo(x,y); p.quadraticCurveTo(x + length*.5,y + random()*4 - 2,x+length,y); p.stroke();
  }
  p.fillStyle = "#fff0bcad";
  p.fillRect(0,0,WIDTH,2);
  return floor;
}

function layoutCanvas() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(canvas.clientWidth * pixelRatio);
  canvas.height = Math.round(canvas.clientHeight * pixelRatio);
  ctx.setTransform(canvas.width / WIDTH, 0, 0, canvas.height / HEIGHT, 0, 0);
}

function draw() {
  ctx.clearRect(0,0,WIDTH,HEIGHT);
  floorImage ||= createFloor();
  ctx.drawImage(floorImage,0,FLOOR);
  for (const body of blocks) {
    const distance = Math.max(0, FLOOR - body.maxY);
    if (distance > 240) continue;
    const opacity = .17 * (1 - distance/240);
    ctx.fillStyle = "rgba(79,45,28," + opacity + ")";
    ctx.beginPath();
    ctx.ellipse(body.x,FLOOR+1,Math.max(16,(body.maxX-body.minX)*.48),3+distance*.018,0,0,TAU);
    ctx.fill();
  }
  for (const body of blocks) {
    ctx.save();
    ctx.translate(body.x,body.y);
    ctx.rotate(body.angle);
    ctx.drawImage(blockImage(body.shape,body.colour,body.seed),-74,-74,148,148);
    ctx.restore();
  }
}


const tools = {
  shape: { active: true, value: 0 },
  colour: { active: false, value: 0 }
};
const welcome = $("welcome");
const orientation = $("orientation");
const hint = $("hint");
let blockSerial = 0;
let openedMenu = null;
let started = false, paused = true, mustResume = false, reachedFullscreen = false;
let originalLandscape = null;
let lastFrame = 0, accumulator = 0;

function makeBlock(shape, x, y, angle = 0, colourSlot) {
  if (blocks.length >= MAX_BLOCKS) {
    const oldest = blocks.findIndex(body => !body.grabs.length);
    if (oldest < 0) return null;
    blocks.splice(oldest, 1);
  }
  const block = makeBody(shapes[shape], x, y);
  const serial = blockSerial++;
  block.angle = angle;
  block.shape = shape;
  block.seed = serial % 4;
  block.colourSlot = colourSlot ?? serial % 6;
  block.colour = palettes[tools.colour.active ? tools.colour.value : 0].colours[block.colourSlot];
  updateGeometry(block);
  if (block.maxY > FLOOR) {
    block.y -= block.maxY - FLOOR;
    updateGeometry(block);
  }
  blocks.push(block);
  return block;
}

function setStarterBlocks() {
  makeBlock(1,395,666,0,1);
  makeBlock(0,391,610,0,2);
  makeBlock(2,390,547,0,0);
  makeBlock(4,545,658,0,3);
  makeBlock(5,635,649,0,4);
  makeBlock(3,758,650,0,0);
}

function makeSwatches(parent, colours) {
  parent.replaceChildren();
  for (const colour of colours) {
    const swatch = document.createElement("i");
    swatch.style.backgroundColor = colour;
    parent.append(swatch);
  }
}

function showToolState() {
  const shape = tools.shape, colour = tools.colour;
  $("shape-button").setAttribute("aria-pressed", shape.active);
  $("colour-button").setAttribute("aria-pressed", colour.active);
  $("shape-name").textContent = shapes[shape.value].name;
  $("colour-name").textContent = palettes[colour.value].name;
  $("shape-mode").textContent = shape.active ? "Build · hold to pick" : "Push · hold to pick";
  $("colour-mode").textContent = colour.active ? "Paint on · hold to pick" : "Paint off · hold to pick";
  drawIcon($("shape-icon"),shape.value, paletteForIcon());
  makeSwatches($("colour-icon"), palettes[colour.value].colours.slice(0,3));
  for (const name of ["shape","colour"]) {
    Array.from($(name + "-options").children).forEach((item, index) => {
      const selected = tools[name].value === index;
      item.setAttribute("aria-checked", selected);
      item.tabIndex = selected ? 0 : -1;
    });
  }
}

function paletteForIcon() {
  return palettes[tools.colour.active ? tools.colour.value : 0].colours[tools.shape.value];
}

function openMenu(name, focus = false) {
  if (openedMenu && openedMenu !== name) closeMenu();
  openedMenu = name;
  $(name + "-picker").hidden = false;
  $(name + "-button").setAttribute("aria-expanded", "true");
  if (focus) $(name + "-options").children[tools[name].value].focus();
}

function closeMenu(restoreFocus = false) {
  if (!openedMenu) return;
  const name = openedMenu;
  $(name + "-picker").hidden = true;
  $(name + "-button").setAttribute("aria-expanded", "false");
  openedMenu = null;
  if (restoreFocus) $(name + "-button").focus();
}

function configureTool(name, choices) {
  const button = $(name + "-button");
  const options = $(name + "-options");
  for (const [index, choice] of choices.entries()) {
    const option = document.createElement("button");
    option.type = "button";
    option.setAttribute("role", "radio");
    const label = document.createElement("span");
    label.textContent = choice.name;
    if (name === "shape") {
      const icon = document.createElement("canvas");
      icon.width = icon.height = 72;
      icon.setAttribute("aria-hidden","true");
      drawIcon(icon,index,palettes[0].colours[index]);
      option.append(icon,label);
    } else {
      const swatches = document.createElement("span");
      swatches.className = "swatches";
      swatches.setAttribute("aria-hidden","true");
      makeSwatches(swatches,choice.colours);
      option.append(label,swatches);
    }
    option.addEventListener("click", event => {
      tools[name].value = index;
      tools[name].active = true;
      showToolState();
      closeMenu(event.detail === 0);
    });
    option.addEventListener("keydown", event => {
      const step = {ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1}[event.key];
      if (!step) return;
      event.preventDefault();
      const next = (index + step + choices.length) % choices.length;
      options.children[next].focus();
    });
    options.append(option);
  }

  let hold = null;
  function stopHold() {
    if (!hold) return;
    clearTimeout(hold.timer);
    hold = null;
  }
  function tap() {
    if (openedMenu === name) closeMenu();
    else {
      closeMenu();
      tools[name].active = !tools[name].active;
      showToolState();
    }
  }
  button.addEventListener("pointerdown", event => {
    if (event.button !== 0 || hold || paused) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    hold = {id: event.pointerId, x: event.clientX, y: event.clientY, long: false};
    hold.timer = setTimeout(() => {
      if (paused) return;
      hold.long = true;
      openMenu(name);
    }, 410);
  });
  button.addEventListener("pointermove", event => {
    if (hold?.id === event.pointerId && !hold.long && Math.hypot(event.clientX - hold.x,event.clientY - hold.y) > 15) stopHold();
  });
  button.addEventListener("pointerup", event => {
    if (hold?.id !== event.pointerId) return;
    const short = !hold.long && !paused;
    stopHold();
    if (short) tap();
  });
  button.addEventListener("lostpointercapture", stopHold);
  button.addEventListener("pointercancel", stopHold);
  button.addEventListener("click", event => { if (event.detail === 0 && !paused) tap(); });
  button.addEventListener("keydown", event => {
    if (event.key === "ArrowDown" && !paused) {
      event.preventDefault();
      openMenu(name, true);
    }
  });
}

function worldPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * WIDTH / rect.width,
    y: (event.clientY - rect.top) * HEIGHT / rect.height
  };
}

function hits(body, point, padding = 0) {
  if (body.radius) return Math.hypot(point.x-body.x,point.y-body.y) <= body.radius + padding;
  return body.vertices.every(v => (point.x-v.x) * v.nx + (point.y-v.y) * v.ny <= padding);
}

function blockAt(point) {
  for (let i = blocks.length - 1; i >= 0; i--) {
    if (hits(blocks[i],point)) return blocks[i];
  }
  for (let i = blocks.length - 1; i >= 0; i--) {
    if (blocks[i].grabs.length === 1 && hits(blocks[i],point,17)) return blocks[i];
  }
  return null;
}

function grabBlock(touch, block) {
  if (block.grabs.length === 2) return;
  block.vx = block.vy = block.spin = 0;
  const offset = rotate(touch.x-block.x,touch.y-block.y,-block.angle);
  touch.localX = offset.x;
  touch.localY = offset.y;
  touch.body = block;
  block.grabs.push(touch);
  if (block.grabs.length === 2) {
    const [a,b] = block.grabs;
    const center = rotate((a.x + b.x)/2 - block.x,(a.y + b.y)/2 - block.y,-block.angle);
    block.gesture = {x:center.x, y:center.y, angle:block.angle, bearing:Math.atan2(b.y-a.y,b.x-a.x)};
  }
}

function updateTouch(touch, point, time) {
  if (Math.hypot(point.x - touch.x, point.y - touch.y) > .7) {
    touch.samples.push({x:point.x,y:point.y,time});
    while (touch.samples.length > 2 && time - touch.samples[1].time > 86) touch.samples.shift();
  }
  touch.x = point.x;
  touch.y = point.y;
  if (!touch.body?.gesture) return;
  const [a,b] = touch.body.grabs;
  if (Math.hypot(b.x-a.x,b.y-a.y) < 12) return;
  const bearing = Math.atan2(b.y-a.y,b.x-a.x);
  const gesture = touch.body.gesture;
  gesture.angle += wrapped(bearing - gesture.bearing);
  gesture.bearing = bearing;
}

function releaseTouch(touch, time, cancelled = false) {
  const block = touch.body;
  if (!block) return;
  block.grabs.splice(block.grabs.indexOf(touch),1);
  block.gesture = null;
  if (block.grabs.length) {
    const remaining = block.grabs[0];
    const offset = rotate(remaining.x-block.x,remaining.y-block.y,-block.angle);
    remaining.localX = offset.x;
    remaining.localY = offset.y;
    remaining.samples = [{x:remaining.x,y:remaining.y,time}];
    remaining.fromTwist = true;
    return;
  }
  const last = touch.samples.at(-1);
  const first = touch.samples.find(sample => last.time - sample.time <= 105) || last;
  const age = time - last.time;
  const span = Math.max(last.time - first.time, 19) / 1000;
  const followThrough = !cancelled && age < 92 ? 1 - clamp((age - 29) / 63,0,1) : 0;
  block.vx = clamp((last.x - first.x) / span * followThrough, -MAX_SPEED, MAX_SPEED);
  block.vy = clamp((last.y - first.y) / span * followThrough, -MAX_SPEED, MAX_SPEED);
  if (cancelled || (age > 100 && !touch.fromTwist)) block.spin = 0;
  if (followThrough && !touch.fromTwist) {
    const offset = rotate(touch.localX,touch.localY,block.angle);
    block.spin = clamp(block.spin + (offset.x*block.vy-offset.y*block.vx) * .00022, -19, 19);
  }
}

function cancelTouches() {
  for (const [id, touch] of pointers) {
    releaseTouch(touch,performance.now(),true);
    if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
  }
  pointers.clear();
}

canvas.addEventListener("pointerdown", event => {
  if (event.button !== 0 || paused) return;
  event.preventDefault();
  hint.hidden = true;
  if (openedMenu) {
    closeMenu();
    return;
  }
  canvas.setPointerCapture(event.pointerId);
  const point = worldPoint(event);
  const touch = {...point, samples: [{...point,time:event.timeStamp}], body:null, proxy:null};
  pointers.set(event.pointerId,touch);
  let block = blockAt(point);
  if (block) {
    if (tools.colour.active) block.colour = palettes[tools.colour.value].colours[block.colourSlot];
  } else if (tools.shape.active) {
    block = makeBlock(tools.shape.value,point.x,point.y);
  } else {
    touch.proxy = makeBody({radius:23},point.x,point.y,true);
    touch.proxy.pusher = true;
  }
  if (block) grabBlock(touch,block);
});

canvas.addEventListener("pointermove", event => {
  const touch = pointers.get(event.pointerId);
  if (!touch) return;
  updateTouch(touch,worldPoint(event),event.timeStamp);
});

function endPointer(event) {
  const touch = pointers.get(event.pointerId);
  if (!touch) return;
  if (event.type === "pointerup") updateTouch(touch,worldPoint(event),event.timeStamp);
  releaseTouch(touch,event.timeStamp,event.type !== "pointerup");
  pointers.delete(event.pointerId);
}

for (const type of ["pointerup","pointercancel","lostpointercapture"]) canvas.addEventListener(type,endPointer);
document.addEventListener("contextmenu", event => event.preventDefault());
document.addEventListener("keydown", event => { if (event.key === "Escape" && openedMenu) closeMenu(true); });
$("clear").addEventListener("click", () => {
  closeMenu();
  cancelTouches();
  blocks.length = 0;
});
$("sound").addEventListener("click", () => {
  audio.muted = !audio.muted;
  const label = audio.muted ? "Turn sound on" : "Mute sound";
  $("sound").setAttribute("aria-pressed", audio.muted);
  $("sound").setAttribute("aria-label", label);
  $("sound").title = label;
  $("sound-waves").setAttribute("d", audio.muted ? "m15 10 5 5m0-5-5 5" : "M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12");
  if (audio.master) audio.master.gain.setTargetAtTime(audio.muted ? 0 : .79, audio.context.currentTime,.022);
  if (!audio.muted) openAudio();
});

const isPortrait = () => stage.clientHeight > stage.clientWidth;
function currentOrientation() {
  const type = screen.orientation?.type;
  if (type?.startsWith("landscape")) return type;
  if (Math.abs(window.orientation) === 90) return "landscape-legacy-" + window.orientation;
  return null;
}
const isFullscreen = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);

function checkView() {
  const current = currentOrientation();
  const reversed = originalLandscape && current && current !== originalLandscape;
  const unavailable = isPortrait() || reversed;
  orientation.hidden = !unavailable;
  $("orientation-title").textContent = reversed ? "Turn back to play" : "Turn to landscape";
  $("orientation-copy").textContent = reversed ? "Return to the side you started on." : "Hold your tablet sideways to use the playroom.";
  welcome.hidden = unavailable || (started && !mustResume);
  $("utility").hidden = unavailable || mustResume || !started;
  const shouldPause = !started || unavailable || mustResume || document.hidden;
  $("top").inert = shouldPause;
  if (shouldPause !== paused) {
    paused = shouldPause;
    accumulator = 0;
    if (paused) {
      cancelTouches();
      closeMenu();
    }
    setAudioRunning(!paused);
  }
}

async function requestGameFullscreen() {
  const request = stage.requestFullscreen || stage.webkitRequestFullscreen;
  try {
    if (request && !isFullscreen()) await request.call(stage);
  } catch {}
  try {
    const lockTo = originalLandscape === "landscape-secondary" ? "landscape-secondary" : "landscape-primary";
    await screen.orientation?.lock?.(lockTo);
  } catch {}
}

$("play").addEventListener("click", () => {
  if (isPortrait()) return;
  if (!started) {
    const current = currentOrientation();
    originalLandscape = current;
    hint.hidden = false;
    setTimeout(() => { hint.hidden = true; }, 6500);
    openAudio();
    started = true;
  }
  mustResume = false;
  requestGameFullscreen();
  checkView();
});

function fullscreenChanged() {
  if (isFullscreen()) reachedFullscreen = true;
  else if (started && reachedFullscreen) {
    mustResume = true;
    welcome.querySelector("h2").textContent = "Ready to come back?";
    welcome.querySelector("p").textContent = "Your blocks are right where you left them.";
    $("play").textContent = "Resume fullscreen";
  }
  checkView();
}

for (const event of ["fullscreenchange","webkitfullscreenchange"]) document.addEventListener(event,fullscreenChanged);
screen.orientation?.addEventListener("change",checkView);
window.addEventListener("orientationchange",checkView);
document.addEventListener("visibilitychange",checkView);
window.addEventListener("resize", () => { layoutCanvas(); checkView(); });
window.addEventListener("blur",cancelTouches);

function frame(now) {
  if (!paused) {
    accumulator += Math.min((now-lastFrame)/1000,.042);
    while (accumulator >= STEP) {
      simulate();
      accumulator -= STEP;
    }
    flushImpact(now);
  }
  lastFrame = now;
  if (!isPortrait()) draw();
  requestAnimationFrame(frame);
}

configureTool("shape",shapes);
configureTool("colour",palettes);
showToolState();
drawIcon($("stamp-left"),0,palettes[0].colours[0]);
drawIcon($("stamp-right"),2,palettes[0].colours[2]);
setStarterBlocks();
layoutCanvas();
checkView();
requestAnimationFrame(frame);

</script>
</body>
</html>
